<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman</title>
</head>

<body style="margin: 0; background-color: black; text-align: center; padding-top: 50px;">
    <div id="game-container" style="position: relative; width: 420px; margin: 0 auto;">
        <canvas id="canvas" width="420" height="460"></canvas>
        <div id="game-over-screen"
            style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); color: white; text-align: center; padding-top: 150px;">
            <h1 style="font-family: 'Emulogic', sans-serif; color: red;">GAME OVER</h1>
            <h2> hola mundo </h2>
            <button id="restart-button"
                style="font-family: 'Emulogic', sans-serif; padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 20px;">JUGAR
                DE NUEVO</button>
        </div>
    </div>
    <div style="display:none;">
        <img id="animation" src="animations.gif" width="140" height="20">
        <img id="ghosts" src="ghost.png" width="140" height="20">
    </div>
    <script src="ghost.js"></script>
    <script src="pacman.js"></script>
    <script src="game.js"></script>
</body>

</html>
